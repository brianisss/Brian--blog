<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>エラー発生。</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'JetBrains Mono';
      src: local('JetBrains Mono'), url('/font/JetBrainsMono-Regular.woff2') format('woff2');
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: 'Nunito', 'Noto Sans TC', 'Microsoft YaHei', sans-serif;
      color: #222;
      background-image: linear-gradient(180deg, #a8d8ff 0%, #e8f4ff 40%, #ffffff 100%);
      background-position: 50% 50%;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* BA 圓點紋理 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(circle, rgba(43, 143, 255, 0.08) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none;
      z-index: 0;
    }

    main {
      text-align: center;
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    #logo img {
      width: 200px;
      filter: drop-shadow(0 4px 12px rgba(43, 143, 255, 0.3));
      border-radius: 16px;
    }

    #error {
      background: rgba(255, 255, 255, 0.85);
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(43, 143, 255, 0.15);
    }

    h1 {
      font-size: 60px;
      color: #ffd84d;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 32px;
      font-family: "JetBrains Mono", monospace;
      color: #2b8fff;
      margin-bottom: 12px;
    }

    p {
      font-size: 18px;
      color: #555;
    }

    #error a {
      color: #2b8fff;
      padding: 3px 10px;
      font-size: larger;
      text-decoration: none;
      font-weight: 700;
      transition: .3s;
      border-radius: 8px;
    }

    #error a:hover {
      color: #000;
      background-color: #2b8fff;
    }

    @media (max-width: 768px) {
      #logo img {
        width: auto;
        height: 180px;
        opacity: .3;
        position: fixed;
        bottom: -20px;
        left: -38%;
        pointer-events: none;
      }
      #error {
        padding: 20px 25px;
        border-radius: 12px;
      }
      h1 { font-size: 42px; }
      h2 { font-size: 24px; }
    }
  </style>
</head>

<body>
  <main>
    <a id="logo" href="/">
      <img src="https://avatars.githubusercontent.com/u/108951298?s=200&v=4" alt="Blue Archive" />
    </a>
    <div id="error">
      <h1>エラー発生。</h1>
      <h2>404 NOT FOUND</h2>
      <p>頁面不存在，請返回 <a href="/">首頁</a> 或 <a href="javascript:history.back()">上一頁</a></p>
    </div>
  </main>
</body>

</html>
